paginate: 5
google_analytics: UA-17998259-1
plugins: [jekyll-paginate, jekyll-redirect-from, jekyll-sitemap]
# jekyll-sitemap이 sitemap.xml과 robots.txt를 만든다. sitemap: false인 페이지·파일은 sitemap에서 빠진다
# spring-camp/: 메일로만 알리는 봄동 신청·피드백 페이지(noindex) / assets/: test.html 같은 정적 HTML
defaults:
  - scope:
      path: "spring-camp"
    values:
      sitemap: false
  - scope:
      path: "assets"
    values:
      sitemap: false
# 봄동 캠프 신청 폼이 보내는 Google Apps Script 웹 앱 URL. 설치 방법은 _scripts/spring-camp-apply.gs 참고
